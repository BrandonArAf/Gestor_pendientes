<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f0f11; --bg2:#17171a; --bg3:#1e1e22; --bg4:#26262c;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
  --text:#f0eff4; --text2:#9998a8; --text3:#5a5968;
  --accent:#7c6af7; --accent2:#5b4fd4;
  --red:#f05252; --red-bg:rgba(240,82,82,0.12); --red-border:rgba(240,82,82,0.25);
  --amber:#f59e0b; --amber-bg:rgba(245,158,11,0.12); --amber-border:rgba(245,158,11,0.25);
  --green:#10b981; --green-bg:rgba(16,185,129,0.12); --green-border:rgba(16,185,129,0.25);
  --llamada:#60a5fa; --correo:#a78bfa; --whatsapp:#34d399;
  --instagram:#f472b6; --seguimiento:#fbbf24;
  --radius:12px; --radius-sm:8px;
  --font-body:'DM Sans',system-ui,sans-serif;
  --font-mono:'DM Mono','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ── Titlebar ── */
.app{display:flex;flex-direction:column;height:100vh}
.titlebar{-webkit-app-region:drag;display:flex;align-items:center;justify-content:space-between;padding:12px 20px 12px 80px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;user-select:none}
.titlebar-title{font-size:13px;font-weight:500;color:var(--text2);letter-spacing:.08em;text-transform:uppercase}
.titlebar-actions{-webkit-app-region:no-drag;display:flex;gap:6px;align-items:center}
.titlebar-btn{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--text3);cursor:pointer;font-family:var(--font-mono);transition:all .15s}
.titlebar-btn:hover{background:var(--bg4);color:var(--text2);border-color:var(--border2)}
.autolaunch-toggle{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);font-family:var(--font-mono)}
.toggle-sw{width:28px;height:16px;background:var(--bg4);border-radius:8px;position:relative;cursor:pointer;border:1px solid var(--border);transition:background .2s}
.toggle-sw.on{background:oklch(62.505% 0.1416 143.894)}
.toggle-sw::after{content:'';position:absolute;width:10px;height:10px;background:white;border-radius:50%;top:2px;left:2px;transition:left .2s}
.toggle-sw.on::after{left:14px}

/* ── Layout ── */
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0}
.sidebar-section{padding:0 12px;margin-bottom:8px}
.sidebar-label{font-size:10px;font-weight:500;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;padding:0 8px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text2);font-size:13px;transition:all .15s;border:1px solid transparent}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--bg3);color:var(--text);border-color:var(--border)}
.nav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.nav-count{margin-left:auto;font-size:11px;font-family:var(--font-mono);color:var(--text3);background:var(--bg4);padding:1px 6px;border-radius:20px}
.sidebar-stats{margin-top:auto;padding:16px 12px 0;border-top:1px solid var(--border)}
.mini-stat{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px;color:var(--text3)}
.mini-stat span:last-child{font-family:var(--font-mono);color:var(--text2);font-size:13px}
.streak-badge{display:flex;align-items:center;gap:6px;background:var(--green-bg);border:1px solid var(--green-border);border-radius:var(--radius-sm);padding:8px 10px;margin-top:10px;font-size:12px;color:var(--green)}

/* ── Content ── */
.content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.content-header{padding:20px 24px 0;flex-shrink:0}
.urgent-alert{background:var(--red-bg);border:1px solid var(--red-border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--red);font-weight:500}

/* ── Add form ── */
.add-form{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;display:none}
.add-form.open{display:block}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.form-grid.two{grid-template-columns:1fr 1fr}
.form-group label{display:block;font-size:11px;color:var(--text3);font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;transition:border-color .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:64px}
.form-group select option{background:var(--bg3)}
.form-actions{display:flex;gap:8px;margin-top:12px}
.btn{padding:7px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;font-family:var(--font-body);cursor:pointer;transition:all .15s;border:1px solid transparent}
.btn-primary{background:var(--accent);color:white;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--text3);border-color:var(--border)}
.btn-ghost:hover{background:var(--bg3);color:var(--text2)}

/* ── Toolbar ── */
.toolbar{display:flex;align-items:center;gap:8px;padding:0 24px 16px;flex-shrink:0}
.add-task-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:white;font-size:13px;font-weight:500;font-family:var(--font-body);cursor:pointer;transition:all .15s}
.add-task-btn:hover{background:var(--accent2)}
.search-box{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;transition:border-color .15s}
.search-box:focus{border-color:var(--border2)}
.search-box::placeholder{color:var(--text3)}

/* ── Task list ── */
.tasks-scroll{flex:1;overflow-y:auto;padding:0 24px 24px}
.tasks-scroll::-webkit-scrollbar{width:4px}
.tasks-scroll::-webkit-scrollbar-track{background:transparent}
.tasks-scroll::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
.section-header{font-size:11px;font-weight:500;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;padding:12px 0 8px;display:flex;align-items:center;gap:8px}
.section-header::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── Task card ── */
.task-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:6px;display:flex;gap:12px;align-items:flex-start;transition:border-color .2s,background .2s,opacity .3s,transform .3s;cursor:default}
.task-card:hover{border-color:var(--border2);background:var(--bg3)}
.task-card.urgent{border-color:var(--red-border);background:rgba(240,82,82,.04)}
.task-card.urgent:hover{border-color:var(--red)}
.task-card.warn{border-color:var(--amber-border)}
.task-card.warn:hover{border-color:var(--amber)}
.task-card.done-card{opacity:.35}
.task-card.completing{opacity:0;transform:translateX(40px)}

.task-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s}
.task-check:hover{border-color:var(--green)}
.task-check.checked{background:var(--green);border-color:var(--green)}

.ch-badge{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ch-llamada-bg{background:rgba(96,165,250,.12)}
.ch-correo-bg{background:rgba(167,139,250,.12)}
.ch-whatsapp-bg{background:rgba(52,211,153,.12)}
.ch-instagram-bg{background:rgba(244,114,182,.12)}
.ch-seguimiento-bg{background:rgba(251,191,36,.12)}

.task-body{flex:1;min-width:0}
.task-meta{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.task-name{font-size:14px;font-weight:500;color:var(--text)}
.ch-pill{font-size:11px;font-weight:500;padding:2px 7px;border-radius:20px;letter-spacing:.03em}
.ch-llamada-pill{background:rgba(96,165,250,.15);color:var(--llamada)}
.ch-correo-pill{background:rgba(167,139,250,.15);color:var(--correo)}
.ch-whatsapp-pill{background:rgba(52,211,153,.15);color:var(--whatsapp)}
.ch-instagram-pill{background:rgba(244,114,182,.15);color:var(--instagram)}
.ch-seguimiento-pill{background:rgba(251,191,36,.15);color:var(--seguimiento)}
.prio-pill{font-size:10px;font-weight:500;padding:1px 6px;border-radius:20px;letter-spacing:.05em;text-transform:uppercase}
.prio-alta{background:var(--red-bg);color:var(--red)}
.prio-media{background:var(--amber-bg);color:var(--amber)}
.prio-baja{background:var(--green-bg);color:var(--green)}
.task-time{margin-left:auto;font-size:11px;font-family:var(--font-mono);color:var(--text3);white-space:nowrap}
.task-time.urgent{color:var(--red);font-weight:500}
.task-time.warn{color:var(--amber)}
.task-desc{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:8px;word-break:break-word}
.task-actions{display:flex;gap:6px;flex-wrap:wrap}
.task-action{font-size:12px;color:var(--text3);background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 9px;cursor:pointer;font-family:var(--font-body);transition:all .15s}
.task-action:hover{background:var(--bg4);color:var(--text2);border-color:var(--border2)}
.task-action.done-btn{color:var(--green);border-color:var(--green-border)}
.task-action.del-btn{color:var(--red);border-color:var(--red-border)}
.task-action.snooze-btn{color:var(--amber);border-color:var(--amber-border)}
.snoozed-badge{font-size:11px;color:var(--amber);font-family:var(--font-mono)}

.empty{text-align:center;padding:60px 20px;color:var(--text3);font-size:14px}
.empty-icon{width:48px;height:48px;margin:0 auto 12px;opacity:.3}

/* ── Modal ── */
.modal-overlay{position:fixed;top:52px;left:0;width:100%;height:calc(100vh - 52px);background:rgba(15,15,17,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);width:82%;max-width:620px;max-height:85vh;padding:28px 30px;display:flex;flex-direction:column;gap:14px;transform:translateY(16px);transition:transform .2s;overflow-y:auto;position:relative}
.modal-overlay.open .modal-card{transform:translateY(0)}
.modal-card::-webkit-scrollbar{width:4px}
.modal-card::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
.modal-close-btn{position:absolute;top:16px;right:16px;background:transparent;border:none;color:var(--text3);cursor:pointer;padding:4px;border-radius:4px;line-height:0}
.modal-close-btn:hover{color:var(--text);background:var(--bg4)}
.modal-header{font-size:18px;font-weight:500;color:var(--text);padding-right:32px}
.modal-subheader{font-size:12px;color:var(--text3);margin-top:-8px}
.modal-row{display:flex;gap:14px}
.modal-row>div{flex:1}
.modal-field{margin-bottom:2px}
.modal-label{font-size:11px;color:var(--text3);text-transform:uppercase;font-weight:500;letter-spacing:.05em;margin-bottom:5px}
.modal-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;transition:border-color .15s}
.modal-input:focus{border-color:var(--accent)}
.modal-textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none;resize:vertical;min-height:80px;line-height:1.6;transition:border-color .15s}
.modal-textarea:focus{border-color:var(--accent)}
.modal-select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);font-size:13px;font-family:var(--font-body);outline:none}
.modal-select option{background:var(--bg3)}
.modal-actions{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.modal-section-title{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:500;border-top:1px solid var(--border);padding-top:12px;margin-top:4px}
.notif-log-list{background:var(--bg3);border-radius:var(--radius-sm);border:1px solid var(--border);overflow:hidden}
.notif-log-item{padding:8px 12px;font-size:12px;color:var(--text2);border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:baseline}
.notif-log-item:last-child{border-bottom:none}
.notif-log-ts{font-family:var(--font-mono);color:var(--text3);font-size:11px;white-space:nowrap;flex-shrink:0}
.snooze-opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.snooze-opt{font-size:12px;color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:6px;padding:4px 10px;cursor:pointer;font-family:var(--font-body);transition:all .15s}
.snooze-opt:hover{background:rgba(245,158,11,.2)}
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <span class="titlebar-title">Pendientes</span>
    <div class="titlebar-actions">
      <label class="autolaunch-toggle" title="Iniciar con Windows">
        <span>Inicio auto</span>
        <div class="toggle-sw" id="autolaunch-toggle" onclick="toggleAutoLaunch()"></div>
      </label>
      <button class="titlebar-btn" onclick="api.sendTestNotification()">Test notif</button>
      <button class="titlebar-btn" onclick="api.openDataFolder()">Carpeta datos</button>
      <button class="titlebar-btn" onclick="exportJSON()">Exportar</button>
      <button class="titlebar-btn" onclick="api.minimizeWindow()">—</button>
      <button class="titlebar-btn" onclick="api.maximizeWindow()">⤢</button>
      <button class="titlebar-btn" onclick="api.closeWindow()">×</button>
    </div>
  </div>

  <div class="main">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Vista</div>
        <div class="nav-item active" id="nav-all"         onclick="setFilter('all')">
          <div class="nav-dot" style="background:var(--text3)"></div>Todos los canales
          <span class="nav-count" id="cnt-all">0</span>
        </div>
        <div class="nav-item" id="nav-llamada"    onclick="setFilter('llamada')">
          <div class="nav-dot" style="background:var(--llamada)"></div>Llamadas
          <span class="nav-count" id="cnt-llamada">0</span>
        </div>
        <div class="nav-item" id="nav-correo"     onclick="setFilter('correo')">
          <div class="nav-dot" style="background:var(--correo)"></div>Correos
          <span class="nav-count" id="cnt-correo">0</span>
        </div>
        <div class="nav-item" id="nav-whatsapp"   onclick="setFilter('whatsapp')">
          <div class="nav-dot" style="background:var(--whatsapp)"></div>WhatsApp
          <span class="nav-count" id="cnt-whatsapp">0</span>
        </div>
        <div class="nav-item" id="nav-instagram"  onclick="setFilter('instagram')">
          <div class="nav-dot" style="background:var(--instagram)"></div>Instagram
          <span class="nav-count" id="cnt-instagram">0</span>
        </div>
        <div class="nav-item" id="nav-seguimiento" onclick="setFilter('seguimiento')">
          <div class="nav-dot" style="background:var(--seguimiento)"></div>Seguimiento
          <span class="nav-count" id="cnt-seguimiento">0</span>
        </div>
      </div>
      <div class="sidebar-section" style="margin-top:8px">
        <div class="sidebar-label">Estado</div>
        <div class="nav-item" id="nav-done" onclick="setFilter('done')">
          <div class="nav-dot" style="background:var(--green)"></div>Completadas
          <span class="nav-count" id="cnt-done">0</span>
        </div>
      </div>
      <div class="sidebar-stats">
        <div class="mini-stat"><span>Urgentes</span><span id="stat-urgent" style="color:var(--red)">0</span></div>
        <div class="mini-stat"><span>Completadas hoy</span><span id="stat-done-today">0</span></div>
        <div class="mini-stat"><span>Total pendientes</span><span id="stat-total">0</span></div>
        <div class="streak-badge" id="streak-badge" style="display:none">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2c0 4-4 6-4 10a4 4 0 008 0c0-4-4-6-4-10z"/></svg>
          <span id="streak-text"></span>
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="content">
      <div class="content-header">
        <div id="urgent-alert" class="urgent-alert" style="display:none">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8"/><path d="M10 6v4M10 14h.01"/></svg>
          <span id="urgent-alert-text"></span>
        </div>

        <div class="add-form" id="add-form">
          <div class="form-grid">
            <div class="form-group">
              <label>Canal</label>
              <select id="f-canal">
                <option value="llamada">Llamada</option>
                <option value="correo">Correo</option>
                <option value="whatsapp">WhatsApp</option>
                <option value="instagram">Instagram</option>
                <option value="seguimiento">Seguimiento post-venta</option>
              </select>
            </div>
            <div class="form-group">
              <label>Celular</label>
              <input type="text" id="f-celular" placeholder="+56 9...">
            </div>
            <div class="form-group">
              <label>Correo</label>
              <input type="email" id="f-correo" placeholder="ejemplo@correo.com">
            </div>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label>Prioridad</label>
              <select id="f-prio">
                <option value="alta">Alta</option>
                <option value="media">Media</option>
                <option value="baja">Baja</option>
              </select>
            </div>
            <div class="form-group">
              <label>Alertar en (horas)</label>
              <input type="number" id="f-alerta" value="4" min="0.5" max="48" step="0.5">
            </div>
            <div class="form-group">
              <label>Contacto / cliente</label>
              <input type="text" id="f-nombre" placeholder="Nombre o empresa">
            </div>
          </div>
          <div class="form-group" style="margin-bottom:10px">
            <label>¿Qué hay que hacer?</label>
            <textarea id="f-desc" placeholder="Describe la tarea brevemente..."></textarea>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" onclick="addTask()">Guardar tarea</button>
            <button class="btn btn-ghost"   onclick="closeForm()">Cancelar</button>
          </div>
        </div>

        <div class="toolbar">
          <button class="add-task-btn" onclick="toggleForm()">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 4v12M4 10h12"/></svg>
            Nueva tarea
          </button>
          <input type="date" id="filter-date" class="search-box" style="flex:0 0 auto;max-width:140px;cursor:pointer" onchange="render()">
          <input class="search-box" id="search-box" type="text" placeholder="Buscar nombre, descripción, celular, correo..." oninput="render()">
        </div>
      </div>

      <div class="tasks-scroll" id="tasks-scroll"></div>
    </div>
  </div>
</div>

<!-- Modal de ticket / edición -->
<div class="modal-overlay" id="task-modal" onclick="handleModalOverlayClick(event)">
  <div class="modal-card" id="modal-card">
    <button class="modal-close-btn" onclick="closeTaskModal()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div id="modal-content-area"></div>
  </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let tasks         = [];
let currentFilter = 'all';
let editingId     = null;

// ─── Channel icons ────────────────────────────────────────────────────────────
const CH_ICONS = {

// ─── Helpers ──────────────────────────────────────────────────────────────────
function getStatus(t) {
  if (t.done) return 'done';
  if (t.snoozedUntil && Date.now() < t.snoozedUntil) return 'snoozed';
  const h = (Date.now() - t.creado) / 3600000;
  if (h >= t.alerta)            return 'urgent';
  if (h >= t.alerta * 0.6)      return 'warn';
  return 'ok';
}

function formatAge(creado) {
  const mins = Math.round((Date.now() - creado) / 60000);
  if (mins < 1)  return 'ahora';
  if (mins < 60) return `${mins}m`;
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h < 24)   return m > 0 ? `${h}h ${m}m` : `${h}h`;
  return `${Math.floor(h / 24)}d`;
}

function formatTs(ts) {
  return new Date(ts).toLocaleString('es-CL', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function calcStreak() {
  const doneItems = tasks.filter(t => t.done && t.donedAt);
  if (!doneItems.length) return 0;
  let streak = 0, day = new Date();
  day.setHours(0,0,0,0);
  while (true) {
    const start = day.getTime(), end = start + 86400000;
    // A "clean day" means no task was OVERDUE that day (rough approximation: no urgent tasks created before that day and still pending)
    const hadUrgentUnresolved = tasks.some(t => {
      if (t.done && t.donedAt && t.donedAt >= start && t.donedAt < end) return false;
      return !t.done && t.creado < start;
    });
    if (hadUrgentUnresolved) break;
    streak++;
    day.setDate(day.getDate() - 1);
    if (streak > 30) break;
  }
  return streak;
}

// ─── Form ─────────────────────────────────────────────────────────────────────
function toggleForm() {
  const f = document.getElementById('add-form');
  f.classList.toggle('open');
  if (f.classList.contains('open')) document.getElementById('f-nombre').focus();
}
function closeForm() { document.getElementById('add-form').classList.remove('open'); }

function addTask() {
  const nombre = document.getElementById('f-nombre').value.trim();
  const desc   = document.getElementById('f-desc').value.trim();
  if (!nombre || !desc) {
    document.getElementById('f-nombre').style.borderColor = nombre ? '' : 'var(--red)';
    document.getElementById('f-desc').style.borderColor   = desc   ? '' : 'var(--red)';
    return;
  }
  tasks.unshift({
    id:      Date.now(),
    canal:   document.getElementById('f-canal').value,
    nombre,
    celular: document.getElementById('f-celular').value.trim(),
    correo:  document.getElementById('f-correo').value.trim(),
    desc,
    prio:    document.getElementById('f-prio').value,
    alerta:  parseFloat(document.getElementById('f-alerta').value) || 4,
    creado:  Date.now(),
    done:    false
  });
  saveTasks();
  ['f-nombre','f-celular','f-correo','f-desc'].forEach(id => {
    document.getElementById(id).value = '';
    document.getElementById(id).style.borderColor = '';
  });
  closeForm();
  render();
}

// ─── Task actions ─────────────────────────────────────────────────────────────
function markDone(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  // Animate card out before toggling
  const card = document.getElementById(`card-${id}`);
  if (card && !t.done) {
    card.classList.add('completing');
    setTimeout(() => {
      t.done    = true;
      t.donedAt = Date.now();
      saveTasks(); render();
    }, 280);
  } else {
    t.done    = !t.done;
    t.donedAt = t.done ? Date.now() : null;
    saveTasks(); render();
  }
}

function deleteTask(id) {
  tasks = tasks.filter(x => x.id !== id);
  saveTasks(); render();
}

async function snoozeTask(id, hours) {
  await api.snoozeTask(id, hours);
  tasks = await api.loadTasks();
  render();
  closeTaskModal();
}

// ─── Filter ───────────────────────────────────────────────────────────────────
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-' + f)?.classList.add('active');
  render();
}

// ─── Export ───────────────────────────────────────────────────────────────────
function exportJSON() {
  const blob = new Blob([JSON.stringify(tasks, null, 2)], { type:'application/json' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `pendientes_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

      </div>

    <div class="modal-row">
      <div class="modal-field">
        <div class="modal-label">Celular</div>
        <input class="modal-input" id="m-celular" value="${escHtml(t.celular||'')}" placeholder="+56 9...">
      </div>
      <div class="modal-field">
        <div class="modal-label">Correo</div>
        <input class="modal-input" id="m-correo" value="${escHtml(t.correo||'')}" placeholder="correo@ejemplo.com">

    </div>
    <div class="modal-row">
      <div class="modal-field">

          ${['alta','media','baja'].map(p =>
            `<option value="${p}" ${t.prio===p?'selected':''}>${p}</option>`

        <div class="modal-label">Alertar en (horas)</div>
        <input class="modal-input" id="m-alerta" type="number" value="${t.alerta}" min="0.5" max="48" step="0.5">

    <div class="modal-field">
      <div class="modal-label">Descripción</div>
      <textarea class="modal-textarea" id="m-desc">${escHtml(t.desc)}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="saveEditFromModal()">Guardar cambios</button>
      ${!t.done

        : `<button class="btn btn-ghost" onclick="markDone(${id});closeTaskModal()">Reabrir</button>`
      }
      <button class="btn" style="background:var(--red-bg);color:var(--red);border-color:var(--red-border)" onclick="deleteTask(${id});closeTaskModal()">Eliminar</button>

function saveEditFromModal() {
  const t = tasks.find(x => x.id === editingId);
  if (!t) return;
  t.nombre  = document.getElementById('m-nombre').value.trim()  || t.nombre;
  t.canal   = document.getElementById('m-canal').value;
  t.celular = document.getElementById('m-celular').value.trim();
  t.correo  = document.getElementById('m-correo').value.trim();
  t.prio    = document.getElementById('m-prio').value;
  t.alerta  = parseFloat(document.getElementById('m-alerta').value) || t.alerta;
  t.desc    = document.getElementById('m-desc').value.trim()    || t.desc;
  // Reset notif so updated alerta is respected
  t.notified     = false;
  t.lastNotified = null;
  saveTasks();
  closeTaskModal();
  render();
}

function closeTaskModal() {
  document.getElementById('task-modal').classList.remove('open');
  editingId = null;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
  const search        = (document.getElementById('search-box')?.value || '').toLowerCase();
  const filterDateStr = document.getElementById('filter-date')?.value;
  const pending       = tasks.filter(t => !t.done);
  const urgent        = pending.filter(t => getStatus(t) === 'urgent');
  const doneToday     = tasks.filter(t => t.done && t.donedAt && Date.now()-t.donedAt < 86400000);

  // Sidebar counts
  ['llamada','correo','whatsapp','instagram','seguimiento'].forEach(ch => {
    const el = document.getElementById('cnt-' + ch);
    if (el) el.textContent = pending.filter(t => t.canal === ch).length;
  });
  document.getElementById('cnt-all').textContent  = pending.length;
  document.getElementById('cnt-done').textContent = tasks.filter(t => t.done).length;

  document.getElementById('stat-urgent').textContent    = urgent.length;
  document.getElementById('stat-done-today').textContent = doneToday.length;
  document.getElementById('stat-total').textContent      = pending.length;

  // Streak
  const streak = calcStreak();
  const sb = document.getElementById('streak-badge');
  if (streak >= 2) {
    sb.style.display = 'flex';
    document.getElementById('streak-text').textContent = `${streak} días sin urgentes`;
  } else {
    sb.style.display = 'none';
  }

  // Alert bar
  const alertEl = document.getElementById('urgent-alert');
  if (urgent.length > 0) {
    alertEl.style.display = 'flex';
    document.getElementById('urgent-alert-text').textContent =
      `${urgent.length} tarea${urgent.length>1?'s':''} vencida${urgent.length>1?'s':''} — requiere${urgent.length>1?'n':''} atención inmediata`;
  } else {
    alertEl.style.display = 'none';
  }

  // Filter tasks
  let filtered;
  if      (currentFilter === 'done') filtered = tasks.filter(t => t.done);
  else if (currentFilter === 'all')  filtered = tasks.filter(t => !t.done);
  else                               filtered = tasks.filter(t => !t.done && t.canal === currentFilter);

  if (filterDateStr) {
    const d = new Date(filterDateStr + 'T00:00:00');
    if (!isNaN(d.getTime())) {
      const s = d.getTime(), e = s + 86400000;
      filtered = filtered.filter(t => t.creado >= s && t.creado < e);
    }
  }
  if (search) {
    filtered = filtered.filter(t =>
      t.nombre.toLowerCase().includes(search)     ||
      t.desc.toLowerCase().includes(search)       ||
      (t.celular && t.celular.toLowerCase().includes(search)) ||
      (t.correo  && t.correo.toLowerCase().includes(search))
    );
  }

  // Sort: urgency → priority
  const SS = { urgent:0, warn:1, snoozed:2, ok:3, done:4 };
  const PS = { alta:0, media:1, baja:2 };
  filtered.sort((a,b) => {
    const d = SS[getStatus(a)] - SS[getStatus(b)];
    return d !== 0 ? d : PS[a.prio] - PS[b.prio];
  });

  const scroll = document.getElementById('tasks-scroll');

  if (!filtered.length) {
    scroll.innerHTML = `<div class="empty">
      <svg class="empty-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="8" width="32" height="32" rx="6"/><path d="M17 24h14M17 30h8"/><path d="M24 17v4"/></svg>
      <div>Sin tareas en esta vista</div>
    </div>`;
    return;
  }

  const sections = currentFilter === 'done'
    ? [{ label:'Completadas', items: filtered }]
    : [
        { label:'Urgentes',  items: filtered.filter(t => getStatus(t)==='urgent')  },
        { label:'En curso',  items: filtered.filter(t => getStatus(t)==='warn')    },
        { label:'Pospuestas',items: filtered.filter(t => getStatus(t)==='snoozed') },
        { label:'Pendientes',items: filtered.filter(t => getStatus(t)==='ok')      },
      ].filter(s => s.items.length > 0);

  scroll.innerHTML = sections.map(s => `
    <div class="section-header">${s.label}
      <span style="font-family:var(--font-mono);color:var(--text3)">${s.items.length}</span>
    </div>
    ${s.items.map(t => {
      const st  = getStatus(t);
      const age = formatAge(t.creado);
      const snoozeInfo = t.snoozedUntil && Date.now() < t.snoozedUntil
        ? `<span class="snoozed-badge">pospuesta hasta ${formatTs(t.snoozedUntil)}</span>` : '';
      return `<div class="task-card ${t.done?'done-card':st}" id="card-${t.id}">
        <div class="task-check ${t.done?'checked':''}" onclick="markDone(${t.id})">
          ${t.done?`<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`:''}
        </div>
        <div class="ch-badge ch-${t.canal}-bg">${CH_ICONS[t.canal]}</div>
        <div class="task-body">
          <div class="task-meta">
            <span class="task-name">${escHtml(t.nombre)}</span>
            <span class="ch-pill ch-${t.canal}-pill">${t.canal}</span>
            <span class="prio-pill prio-${t.prio}">${t.prio}</span>
            ${snoozeInfo}
            <span class="task-time ${st==='urgent'?'urgent':st==='warn'?'warn':''}">${age}${st==='urgent'?' · VENCIDA':''}</span>
          </div>
          <div class="task-desc">${escHtml(t.desc.slice(0,110))}${t.desc.length>110?'…':''}</div>
          <div class="task-actions">
            <button class="task-action" onclick="openTaskModal(${t.id})">Abrir ticket</button>
            ${!t.done
              ? `<button class="task-action done-btn" onclick="markDone(${t.id})">Marcar lista</button>`
              : `<button class="task-action" onclick="markDone(${t.id})">Reabrir</button>`
            }
            <button class="task-action del-btn" onclick="deleteTask(${t.id})">Eliminar</button>
          </div>
        </div>
      </div>`;
    }).join('')}
  `).join('');
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
api.onTasksRefresh(() => render());

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'n') { e.preventDefault(); toggleForm(); }
  if (e.key === 'Escape') { closeForm(); closeTaskModal(); }
});

loadTasks();
initAutoLaunch();
setInterval(render, 60_000);
</script>
